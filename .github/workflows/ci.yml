name: Synthetic release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IGAN_PYTHON: python3.11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Configure cache location
        run: printf 'IGAN_CACHE=%s/igan-flow\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned tools and repeat without changing source
        run: |
          bash scripts/bootstrap.sh
          bash scripts/bootstrap.sh
          git diff --exit-code
          bash scripts/bootstrap_browser.sh
      - name: Install browser system dependencies
        run: node "$IGAN_CACHE/tools/browser-qa/node_modules/playwright/cli.js" install-deps chromium
      - name: Run the same local release checks
        run: bash scripts/ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-check-evidence
          path: results/ci/
          retention-days: 14
